<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro - NutriVida</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>

    <body class="bg-light">
        <header>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center" href="home.html">
                        <img src="Imagenes/Logo NutriVida.png" alt="Logo NutriVida" width="30" height="30" class="d-inline-block align-text-top me-2">
                        NutriVida
                    </a>
                </div>
            </nav>
        </header>

        <main>
            <section class="py-5">
                <div class="container" style="max-width: 500px;">
                    <div class="card shadow-sm p-4 border-0">
                        <h1 class="text-center mb-1">Crear Cuenta</h1>
                        <p class="text-center text-muted mb-4">Únete a Clínica NutriVida</p>

                        <form id="formRegistro" novalidate>
                            
                            <div class="mb-3">
                                <label for="nombreReg" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombreReg" maxlength="100">
                                <div class="invalid-feedback" id="errorNombreReg"></div>
                            </div>

                            <div class="mb-3">
                                <label for="correoReg" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correoReg" maxlength="100">
                                <div class="invalid-feedback" id="errorCorreoReg"></div>
                            </div>

                            <div class="mb-3">
                                <label for="claveReg" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="claveReg" maxlength="10">
                                <div class="invalid-feedback" id="errorClaveReg"></div>
                                <div class="form-text">Debe tener entre 4 y 10 caracteres.</div>
                            </div>

                            <div class="mb-3">
                                <label for="claveConf" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="claveConf" maxlength="10">
                                <div class="invalid-feedback" id="errorClaveConf"></div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success">Registrarse</button>
                            </div>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            ¿Ya tienes cuenta? <a href="login.html" class="text-success fw-bold text-decoration-none">Inicia sesión aquí</a>
                        </p>
                    </div>
                </div>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="registro.js"></script>
    </body>
</html>
