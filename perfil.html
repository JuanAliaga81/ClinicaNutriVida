<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - NutriVida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="home.html">
                    <img src="Imagenes/Logo NutriVida.png" alt="Logo NutriVida" width="30" height="30" class="d-inline-block align-text-top me-2">
                    NutriVida
                </a>
                <div class="ms-auto">
                    <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row g-4">
            <!-- Columna Izquierda: Datos del Usuario -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center py-4">
                        <div class="mb-3">
                            <i class="fa-solid fa-circle-user fa-5x text-secondary"></i>
                        </div>
                        <h4 class="fw-bold mb-1" id="perfilNombre">Cargando...</h4>
                        <p class="text-muted mb-3" id="perfilCorreo">Cargando...</p>
                        <a href="agendar.html" class="btn btn-success w-100">Agendar Nueva Cita</a>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Historial de Citas -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-calendar-days text-success me-2"></i>Mis Citas</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Servicio</th>
                                        <th>Fecha</th>
                                        <th>Teléfono de Contacto</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaMisCitas">
                                    <!-- Se llena con JS -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Mensaje si no tiene citas -->
                        <div id="mensajeSinCitas" class="text-center py-5 d-none">
                            <p class="text-muted mb-0">No tienes citas agendadas actualmente.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
